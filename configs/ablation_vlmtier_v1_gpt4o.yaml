defaults: base

# VLM tier ablation — v1: standard tier (gpt-4o).
# Production reference: this is the model behind the §5.2 GPT-4o headline curve
# and §5.3's GPT-4o achieved_goal winner (0% teleport-collapse).
#
# See configs/ablation_vlmtier_v0_mini.yaml for the full sweep design and the
# hypothesis under test.

replay:
  type: cf_her
  her_k: 4
  her_strategy: future

  cf_provider: verified
  cf_input_kind: vlm
  p_counterfactual: 0.25
  cf_min_confidence: 0.5
  cf_fallback_to_achieved: true
  cf_call_interval: 8
  cf_window: 4
  reject_teleport_radius_m: 0.05

  # VLM provider — TIER VARIABLE
  vlm_provider: openai
  vlm_model: gpt-4o               # ← tier variable (standard)
  vlm_keyframes: 5
  vlm_variant: all

  verify_enabled: true
  verify_n_steps: 50
  verify_success_threshold: 0.05
  verify_repeat_action: true

vlm:
  max_tokens: 512
  temperature: 0.0

logging:
  run_name: ablation_vlmtier_v1_gpt4o
