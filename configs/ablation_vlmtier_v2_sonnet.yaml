defaults: base

# VLM tier ablation — v2: frontier-anthropic tier (claude-sonnet-4-5).
# This is the per-task default for FetchPickAndPlace in the production plan
# (overnight_path_c_plan.json) because §5.5 real-data eval showed Sonnet 4.5
# rescues PnP teleport-collapse (75% → 0%) when GPT-4o falls back.
#
# See configs/ablation_vlmtier_v0_mini.yaml for the full sweep design.

replay:
  type: cf_her
  her_k: 4
  her_strategy: future

  cf_provider: verified
  cf_input_kind: vlm
  p_counterfactual: 0.25
  cf_min_confidence: 0.5
  cf_fallback_to_achieved: true
  cf_call_interval: 8
  cf_window: 4
  reject_teleport_radius_m: 0.05

  # VLM provider — TIER VARIABLE
  vlm_provider: anthropic
  vlm_model: claude-sonnet-4-5    # ← tier variable (frontier-anthropic)
  vlm_keyframes: 5
  vlm_variant: all

  verify_enabled: true
  verify_n_steps: 50
  verify_success_threshold: 0.05
  verify_repeat_action: true

vlm:
  max_tokens: 512
  temperature: 0.0

logging:
  run_name: ablation_vlmtier_v2_sonnet
