defaults: base

# CF-HER buffer with hand-coded oracle counterfactual goals.
# This is the KILL-experiment ceiling: if HER+Oracle-CF does NOT beat HER
# by >= 0.10 on success rate, the entire Path C direction is dead.

replay:
  type: cf_her
  her_k: 4
  her_strategy: future

  # CF-specific settings
  cf_provider: oracle             # oracle | vlm | verified
  cf_input_kind: state            # state | vlm
  p_counterfactual: 0.25          # 25% of relabels use CF; 75% standard HER
  cf_min_confidence: 0.5
  cf_fallback_to_achieved: true
  cf_call_interval: 1             # generate CF every failed episode
  cf_window: 4

logging:
  run_name: oracle_cf
