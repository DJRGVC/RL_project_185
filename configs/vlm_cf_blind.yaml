defaults: base

# CF-HER buffer with VLM-generated counterfactual goals — "no-desired-goal"
# variant. Identical to vlm_cf.yaml except the prompt withholds the
# desired_goal coordinates from the VLM, forcing it to infer the corrective
# target from the keyframes alone. Goal: eliminate teleport-collapse at the
# prompt level rather than just gating it via reject_teleport_radius_m.

replay:
  type: cf_her
  her_k: 4
  her_strategy: future

  cf_provider: vlm
  cf_input_kind: vlm
  p_counterfactual: 0.25
  cf_min_confidence: 0.5
  cf_fallback_to_achieved: true
  cf_call_interval: 16            # cost control: VLM every 16 failed eps
  cf_window: 4
  reject_teleport_radius_m: 0.05

  # VLM provider config
  vlm_provider: anthropic         # openai | anthropic
  vlm_model: claude-sonnet-4-5    # match vlm_cf.yaml (Sonnet 4.5 stable at scale)
  vlm_keyframes: 5
  vlm_variant: achieved_goal_blind  # NEW: withholds desired_goal from prompt
  vlm_task_description: ""        # filled per env in train.py

vlm:
  max_tokens: 512
  temperature: 0.0

logging:
  run_name: vlm_cf_blind
