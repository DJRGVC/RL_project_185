defaults: base

# CF-HER buffer with VLM-generated counterfactuals — BLIND + NUMERIC variant.
# Withholds desired_goal coords AND augments the prompt with the numerical
# trajectory table. This is the bottom-right cell of the 2x2 ablation matrix:
#   - knows desired_goal x visual only         -> vlm_cf.yaml
#   - knows desired_goal x visual + numeric    -> vlm_cf_numeric.yaml
#   - blind             x visual only         -> vlm_cf_blind.yaml
#   - blind             x visual + numeric    -> THIS FILE

replay:
  type: cf_her
  her_k: 4
  her_strategy: future

  cf_provider: vlm
  cf_input_kind: vlm
  p_counterfactual: 0.25
  cf_min_confidence: 0.5
  cf_fallback_to_achieved: true
  cf_call_interval: 16            # cost control: VLM every 16 failed eps
  cf_window: 4
  reject_teleport_radius_m: 0.05

  # VLM provider config
  vlm_provider: anthropic         # openai | anthropic
  vlm_model: claude-sonnet-4-5    # match vlm_cf.yaml — Sonnet 4.5 stable at scale
  vlm_keyframes: 5
  vlm_variant: achieved_goal_blind_numeric  # NEW: blind + numerical table
  vlm_task_description: ""        # filled per env in train.py

vlm:
  max_tokens: 512
  temperature: 0.0

logging:
  run_name: vlm_cf_blind_numeric
