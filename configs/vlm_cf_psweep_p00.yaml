defaults: base

# VLM-CF p_counterfactual = 0.00 — pure HER ablation point (no VLM relabels).
# Lower-bound anchor for the VLM-CF p sweep. Should match HER baseline
# performance exactly; no API spend since p=0 short-circuits the VLM call.
#
# Sweep schedule: p ∈ {0.00, 0.10, 0.25, 0.50, 0.75, 1.00} on FetchPickAndPlace-v4.
# Mirrors the oracle-CF cf_psweep_p* grid but with the *VLM* CF provider
# (Anthropic Sonnet-4.5, achieved_goal variant) instead of the oracle.
# Tests whether the same HER↔CF tradeoff holds when the relabel comes from
# an imperfect VLM rather than a privileged simulator.

replay:
  type: cf_her
  her_k: 4
  her_strategy: future

  cf_provider: vlm
  cf_input_kind: vlm
  p_counterfactual: 0.00          # ← sweep variable
  cf_min_confidence: 0.5
  cf_fallback_to_achieved: true
  cf_call_interval: 16            # match Phase 2 (provider RPM headroom)
  cf_window: 4
  reject_teleport_radius_m: 0.05

  # VLM provider config — matches configs/vlm_cf.yaml exactly so sweep is
  # ceteris-paribus on p only.
  vlm_provider: anthropic
  vlm_model: claude-sonnet-4-5
  vlm_keyframes: 5
  vlm_variant: achieved_goal
  vlm_task_description: ""

vlm:
  max_tokens: 512
  temperature: 0.0

logging:
  run_name: vlm_cf_psweep_p00
