defaults: base

# VLM-CF p_counterfactual = 1.00 — pure VLM-CF relabels (no HER achieved-future).
# Upper-bound anchor: every HER-style relabel becomes a VLM-imagined CF goal.
# Tests the strong claim that the VLM-generated counterfactual *alone*
# carries enough goal-distribution signal to beat the standard HER mix.
# If this beats p=0.25 by ≥ 0.05 SR, "pure VLM-CF" is the right default;
# if it underperforms, HER's hindsight guarantee is still load-bearing.
#
# Note: with cf_fallback_to_achieved=true, any low-confidence VLM call
# still falls back to achieved-future so the buffer is never empty.

replay:
  type: cf_her
  her_k: 4
  her_strategy: future

  cf_provider: vlm
  cf_input_kind: vlm
  p_counterfactual: 1.00          # ← sweep variable
  cf_min_confidence: 0.5
  cf_fallback_to_achieved: true
  cf_call_interval: 16
  cf_window: 4
  reject_teleport_radius_m: 0.05

  vlm_provider: anthropic
  vlm_model: claude-sonnet-4-5
  vlm_keyframes: 5
  vlm_variant: achieved_goal
  vlm_task_description: ""

vlm:
  max_tokens: 512
  temperature: 0.0

logging:
  run_name: vlm_cf_psweep_p100
