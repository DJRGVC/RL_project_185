# Sparse-reward MetaWorld SAC sweep.
#
# Variants (replay-buffer priority strategies):
#   uniform        — every transition sampled equally
#   per            — TD-error PER (Schaul et al. 2016)
#   demo-replay    — buffer pre-loaded with K expert episodes; uniform sampling
#   demo-priority  — pre-loaded demos held at max priority so they're always sampled

tasks: [drawer-open-v3, sweep-into-v3, button-press-v3]
variants: [uniform, per, demo-replay, demo-priority]
seeds: [0, 1, 2, 3, 4]

total_steps: 500000
sparse_reward: true        # env reward replaced by float(success)
output_dir: output

env:
  max_episode_steps: 500
  camera_name: null         # rendering not needed; null skips the kwarg

sac:
  gamma: 0.99
  tau: 0.005
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  lr_alpha: 3.0e-4
  hidden_sizes: [256, 256]
  batch_size: 256
  start_steps: 5000
  update_after: 1000
  update_every: 1
  target_update_every: 1
  target_entropy: null      # null → -dim(action_space)

replay:
  capacity: 1000000
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_end: 1.0
  default_priority: 1.0
  priority_epsilon: 1.0e-6
  # demo-priority variant: priority assigned to every demo transition. 10x the
  # default keeps demos heavily oversampled but not so dominant that fresh
  # transitions get starved.
  demo_priority: 10.0

demos:
  # K expert episodes per task, collected once before training via MetaWorld's
  # scripted policies (the same ENV_POLICY_MAP we use for the env).
  episodes_per_task: 10
  # Expert noise during demo rollouts. 0.0 = pure scripted expert.
  noise: 0.0

eval:
  every_steps: 10000
  episodes: 10
  success_thresholds: [0.8, 0.5, 0.25]
